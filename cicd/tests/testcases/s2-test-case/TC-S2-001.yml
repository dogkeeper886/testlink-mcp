id: TC-S2-001
name: "Flow: provision project + suite fixtures"
suite: s2-test-case
priority: 1
timeout: 60000
dependencies: [TC-S1-001]

# First stage of the end-to-end flow. Provisions the shared fixtures every
# later stage consumes, published under /tmp/tl-flow/. Idempotent.

steps:
  - name: "Ensure project fixture (idempotent via MCP)"
    command: |
      mkdir -p /tmp/tl-flow
      PROJECTS=$(npx tsx cicd/tests/src/mcp-client.ts list_projects "{}" 2>/dev/null)
      PID=$(echo "$PROJECTS" | python3 -c "import sys,json; d=json.loads(json.load(sys.stdin)['content'][0]['text']); d=d if isinstance(d,list) else []; m=[p for p in d if p.get('prefix')=='MFT']; print(m[0]['id'] if m else '')")
      if [ -z "$PID" ]; then
        CP=$(npx tsx cicd/tests/src/mcp-client.ts create_project "{\"name\":\"MCP Flow Tests\",\"prefix\":\"MFT\",\"notes\":\"MCP flow tests\"}" 2>/dev/null)
        PID=$(echo "$CP" | python3 -c "import sys,json; d=json.loads(json.load(sys.stdin)['content'][0]['text']); p=d[0] if isinstance(d,list) else d; print(p['id'])")
      fi
      echo "$PID" > /tmp/tl-flow/project_id
      echo "MCP Flow Tests" > /tmp/tl-flow/project_name
      echo "MFT" > /tmp/tl-flow/prefix
      echo "PROVISION_PROJECT_OK $PID MFT"
    timeout: 30000
    expectPatterns:
      - "PROVISION_PROJECT_OK [0-9]+ MFT"

  - name: "Verify the project fixture is listed, with no credential in the payload"
    command: |
      npx tsx cicd/tests/src/mcp-client.ts list_projects "{}" 2>/dev/null | python3 -c "import sys,json; d=json.loads(json.load(sys.stdin)['content'][0]['text']); d=d if isinstance(d,list) else []; pid=open('/tmp/tl-flow/project_id').read().strip(); m=[p for p in d if str(p.get('id'))==pid]; assert m,'flow project not listed'; assert m[0].get('name')=='MCP Flow Tests','project name mismatch'; assert m[0].get('prefix')=='MFT','project prefix mismatch'; leaked=[p.get('id') for p in d if 'api_key' in p]; assert not leaked,'api_key returned for project(s) %s' % leaked; print('LIST_PROJECTS_OK')"
    timeout: 30000
    expectPatterns:
      - "LIST_PROJECTS_OK"

  - name: "Ensure suite fixture (idempotent via MCP)"
    command: |
      PID=$(cat /tmp/tl-flow/project_id)
      SUITES=$(npx tsx cicd/tests/src/mcp-client.ts list_test_suites "{\"project_id\":\"$PID\"}" 2>/dev/null)
      SID=$(echo "$SUITES" | python3 -c "import sys,json; d=json.loads(json.load(sys.stdin)['content'][0]['text']); d=d if isinstance(d,list) else []; m=[s for s in d if s.get('name')=='Flow Suite']; print(m[0]['id'] if m else '')")
      if [ -z "$SID" ]; then
        CS=$(npx tsx cicd/tests/src/mcp-client.ts create_test_suite "{\"project_id\":\"$PID\",\"suite_name\":\"Flow Suite\",\"details\":\"flow fixture\"}" 2>/dev/null)
        SID=$(echo "$CS" | python3 -c "import sys,json; d=json.loads(json.load(sys.stdin)['content'][0]['text']); s=d[0] if isinstance(d,list) else d; print(s['id'])")
      fi
      echo "$SID" > /tmp/tl-flow/suite_id
      [ -n "$SID" ] && echo "PROVISION_SUITE_OK suite=$SID"
    timeout: 30000
    expectPatterns:
      - "PROVISION_SUITE_OK suite=[0-9]+"

criteria: |
  Provision shared flow fixtures through the MCP tools: a dedicated project
  (create_project, reused by prefix if already there) that list_projects then
  reports without its TestLink api_key, and a reusable top-level "Flow Suite".
  Publishes project_id, project_name, prefix, suite_id to /tmp/tl-flow/.
goal: "Provision project + suite fixtures for the end-to-end flow"
