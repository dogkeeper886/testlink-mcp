id: TC-S8-002
name: "Scratch: a rename by INTERNAL id leaves every other field alone"
suite: s8-project-lifecycle
priority: 2
timeout: 30000
dependencies: [TC-S8-001]

# The headline promise of update_project is that it is PARTIAL — the tool
# description tells a model not to defensively re-send every field, and this is
# what makes that safe to believe. Sending only the name must leave notes,
# active, visibility, colour and all four options exactly as they were.
#
# The "before" values are read from the backend rather than assumed from
# TC-S8-001: that stage reuses a project a failed run left behind, so its field
# values are not knowable in advance. Read, change one field, compare.

steps:
  - name: "Record the project's current state"
    command: |
      npx tsx cicd/tests/src/mcp-client.ts list_projects "{}" 2>/dev/null | python3 -c "import sys,json; d=json.loads(json.load(sys.stdin)['content'][0]['text']); d=d if isinstance(d,list) else []; m=[p for p in d if p.get('prefix')=='MSCR']; assert m,'throwaway project missing'; json.dump(m[0], open('/tmp/tl-flow/scratch_project_before.json','w')); print('BEFORE_CAPTURED_OK')"
    timeout: 20000
    expectPatterns:
      - "BEFORE_CAPTURED_OK"

  - name: "Rename by internal id, then prove nothing else moved"
    command: |
      SID=$(cat /tmp/tl-flow/scratch_project_id)
      RESULT=$(npx tsx cicd/tests/src/mcp-client.ts update_project "{\"project_id\":\"$SID\",\"name\":\"MCP Scratch Project Renamed\"}" 2>/dev/null)
      echo "$RESULT" | python3 -c "import sys,json; r=json.load(sys.stdin); assert not r.get('isError'),'update by internal id errored: '+r['content'][0]['text'][:160]; d=json.loads(r['content'][0]['text']); o=d[0] if isinstance(d,list) else d; assert o.get('status') in (True,'true',1),'no success status'; print('RENAME_OK')"
      npx tsx cicd/tests/src/mcp-client.ts list_projects "{}" 2>/dev/null | python3 -c "import sys,json; d=json.loads(json.load(sys.stdin)['content'][0]['text']); d=d if isinstance(d,list) else []; a=[p for p in d if p.get('prefix')=='MSCR']; assert a,'project vanished'; a=a[0]; b=json.load(open('/tmp/tl-flow/scratch_project_before.json')); assert a['name']=='MCP Scratch Project Renamed','rename did not land: '+a['name']; bad=[f for f in ('notes','active','is_public','color','prefix') if a[f]!=b[f]]; assert not bad,'partial update clobbered '+','.join(bad); assert a['opt']==b['opt'],'partial update clobbered options: '+repr(b['opt'])+' -> '+repr(a['opt']); print('UNTOUCHED_OK')"
    timeout: 20000
    expectPatterns:
      - "RENAME_OK"
      - "UNTOUCHED_OK"

criteria: |
  update_project accepts a numeric internal project id, changes only the name,
  and the notes, active state, visibility, colour, prefix and all four project
  options read back identical to what they were before the call.
goal: "Renaming a project changes the name and nothing else"
